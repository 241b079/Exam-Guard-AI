version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: exam_proctoring_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: online_exam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d online_exam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exam_proctoring_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Selective Forwarding Unit (SFU) Media Server (LiveKit)
  livekit:
    image: livekit/livekit-server:latest
    container_name: exam_proctoring_livekit
    command: --dev
    ports:
      - "7880:7880"       # WebRTC Signaling & HTTP API
      - "7881:7881"       # WebRTC TCP Fallback
      - "7882:7882/udp"   # WebRTC UDP Media Traffic
    environment:
      - LIVEKIT_KEYS=devkey:secret_1234567890_abcdefghijklmnopqrstuvwxyz
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
